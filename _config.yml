title: "Dr. Shijie Bao | Mathematician"
description: "Academic homepage of Dr. Shijie Bao (包诗界): several complex variables, algebraic geometry, multiplier ideal sheaves, L2 extension problems, and Bergman kernel theory."
url: "https://naihuang-bao.github.io"
baseurl: ""
markdown: kramdown       # 必须指定 Markdown 解析器
kramdown:
  input: GFM
  math_engine: mathjax
highlighter: rouge       # 代码高亮

# 确保没有排除 .md 文件
exclude:
  - "*.log"
  - "Gemfile*"
  # ❌ 禁止包含: - "*.md"

# 添加必要 gem（如果使用 GitHub Pages）
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
