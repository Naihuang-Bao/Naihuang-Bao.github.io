<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  {% seo %}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/site.css">

  {% if page.math %}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  {% endif %}
</head>
<body id="top" class="{% if page.url == '/' %}home-page{% else %}inner-page{% endif %}">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <nav class="navbar" aria-label="Primary navigation">
      <a class="site-name" href="{{ site.baseurl }}/">Shijie Bao</a>
      <div class="nav-links">
        <a href="{{ site.baseurl }}/" {% if page.url == '/' %}class="active" aria-current="page"{% endif %}>Home</a>
        <a href="{{ site.baseurl }}/resume/" {% if page.url == '/resume/' %}class="active" aria-current="page"{% endif %}>Resume</a>
        <a href="{{ site.baseurl }}/publications/" {% if page.url == '/publications/' %}class="active" aria-current="page"{% endif %}>Publications</a>
        <a href="{{ site.baseurl }}/preprints/" {% if page.url == '/preprints/' %}class="active" aria-current="page"{% endif %}>Preprints</a>
        <a href="{{ site.baseurl }}/courses/" {% if page.url == '/courses/' %}class="active" aria-current="page"{% endif %}>Courses</a>
        <a href="{{ site.baseurl }}/notes/" {% if page.url == '/notes/' %}class="active" aria-current="page"{% endif %}>Notes</a>
        <a href="{{ site.baseurl }}/ai/" {% if page.url == '/ai/' %}class="active" aria-current="page"{% endif %}>AI</a>
      </div>
    </nav>
  </header>

  <div class="site-shell">
    <main id="main-content" class="page-content">
      {% unless page.url == '/' %}
      <header class="page-heading">
        <h1>{{ page.title }}</h1>
      </header>
      {% endunless %}

      {{ content }}
    </main>

    <footer class="site-footer">
      <p>&copy; {{ site.time | date: "%Y" }} Shijie Bao</p>
      <a href="#top">Back to top <span aria-hidden="true">&uarr;</span></a>
    </footer>
  </div>

  <script>
  (function() {
    var bp = document.createElement('script');
    var curProtocol = window.location.protocol.split(':')[0];
    if (curProtocol === 'https') {
      bp.src = 'https://zz.bdstatic.com/linksubmit/push.js';
    } else {
      bp.src = 'http://push.zhanzhang.baidu.com/push.js';
    }
    var s = document.getElementsByTagName('script')[0];
    s.parentNode.insertBefore(bp, s);
  })();
  </script>
</body>
</html>
